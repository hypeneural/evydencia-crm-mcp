name: MCP validation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install immutable dependencies
        run: npm ci --ignore-scripts
      - name: Offline MCP and VPS validation
        run: npm run validate:local
      - name: Check Docker build inputs
        run: |
          test -f deploy/vps/Dockerfile
          test -f deploy/vps/entrypoint.sh
          # Compose config requires secret paths existing on the deployment host.
        env:
          COMPOSE_DISABLE_ENV_FILE: '1'
