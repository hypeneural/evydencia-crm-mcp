name: Validate MCP
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproducible install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run doctor
      - run: npm run check
      - run: npm test
      - run: npm run smoke
      - run: npm run conversation:smoke
      - run: test ! -f .env
