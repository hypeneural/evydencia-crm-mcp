name: Validate MCP
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproducible install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $bad = @()
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) { $bad += $_.Name }
          }
          if ($bad.Count -gt 0) { throw "PowerShell syntax error: $($bad -join ', ')" }
      - name: Validate stand-alone PHP exporter (no CRM startup)
        run: |
          command -v php
          php -l tools/export-natal-digest.php
          php tools/export-natal-digest.php --help
      - run: npm run doctor
      - run: npm run check
      - run: npm test
      - run: npm run smoke
      - run: npm run conversation:smoke
      - run: npm run startup:smoke
      - run: test ! -f .env
