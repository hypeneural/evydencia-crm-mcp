schema_version: "1"
name: evydencia-crm-mcp
criticality: standard
ram_budget_mb: 256
cpu_budget_cores: 0.25
deployment:
  tool: compose
  file: compose.yaml
  serial: true
  lock_file: .deploy.lock
network:
  edge: false
  egress_only: true
health:
  type: http
  url: "http://127.0.0.1:18090/health?details=true"
  interval: 30
data:
  - /srv/apps/evydencia-crm-mcp/repo
secrets:
  required:
    - /srv/secrets/evydencia-crm-mcp/tunnel.env
