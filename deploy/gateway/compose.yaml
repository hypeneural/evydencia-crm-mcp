services:
  gateway:
    build:
      context: /srv/apps/evydencia-crm-mcp/repo
      dockerfile: deploy/gateway/Dockerfile
    image: evydencia-crm-mcp-gateway:0.6.0
    init: true
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    env_file:
      - /srv/secrets/evydencia-crm-mcp/gateway.env
    environment:
      NODE_ENV: production
      EVYD_LISTEN_HOST: 0.0.0.0
      EVYD_LISTEN_PORT: "8090"
      # Caddy overwrites X-Forwarded-For with the real client IP (rate-limit key only).
      EVYD_TRUST_PROXY: "1"
    # No host port: only Caddy reaches the gateway, through the existing `edge` network.
    expose:
      - "8090"
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=1777,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      edge:
        aliases:
          - evydencia-crm-mcp-gateway
    cpus: "0.5"
    mem_limit: 256m
    pids_limit: 64
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
networks:
  edge:
    external: true
